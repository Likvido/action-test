name: "Run all unit tests"
description: "Uses dotnet test in Microsoft.Testing.Platform mode to run the unit tests of a solution or project"
inputs:
  test-target:
    description: 'The solution (.sln, .slnx, .slnf) or project (a project file or a directory containing one) to test. Default is empty, which runs the solution or project in the repository root'
    required: false
    default: ''
  framework:
    description: 'The target framework to run tests for (default is to run for all target frameworks of the test projects)'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Check global.json
      # Without this setting dotnet test runs in VSTest mode and rejects --solution and --project with an
      # MSBuild switch error that does not say what is missing. Comment lines are dropped first, so a
      # commented-out setting does not count.
      run: |
        if [ ! -f global.json ] || ! sed -e 's#^[[:space:]]*//.*##' -e 's#/\*.*\*/##g' global.json | tr -d ' \t\r\n' | grep -qi '"runner":"Microsoft.Testing.Platform"'; then
          echo '::error::likvido/action-test v2 runs tests with Microsoft.Testing.Platform, which needs a global.json in the repository root containing "test": { "runner": "Microsoft.Testing.Platform" }. Add it, or stay on likvido/action-test@v1.5 until the repository has moved.'
          exit 1
        fi
      shell: bash

    - name: Run tests
      env:
        FRAMEWORK: ${{ inputs.framework }}
        TEST_TARGET: ${{ inputs.test-target }}
      run: |
        args=(--configuration Release --results-directory TestResults)
        if [ -n "$FRAMEWORK" ]; then
          args+=(--framework "$FRAMEWORK")
        fi
        case "$TEST_TARGET" in
          '') ;;
          *.sln|*.slnx|*.slnf) args+=(--solution "$TEST_TARGET") ;;
          *) args+=(--project "$TEST_TARGET") ;;
        esac
        dotnet test "${args[@]}"
      shell: bash

    - name: Upload dotnet test results
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults
        if-no-files-found: ignore
